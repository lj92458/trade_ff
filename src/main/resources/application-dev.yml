debug: false
server:
  port: 8083
  servlet:
    context-path: /trade_c2c_arbitrum
    session:
      timeout: P7DT0H0M0S #300秒，必须是合法的Duration, P1Y2M10DT2H30M15.03S表示1年2个月10天
      persistent: true #重启时，保存到磁盘
  tomcat:
    basedir: d:/log/tomcat
    accesslog:
      enabled: true
      suffix: .log
      prefix: access_log
      file-date-format: .yyyy-MM-dd
      directory: logs
      pattern: common
  shutdown: graceful #优雅停机，参考https://zhuanlan.zhihu.com/p/143469078

# spring-boot-starter-actuator相关配置。暴露shutdown接口.
# https://docs.spring.io/spring-boot/docs/current/actuator-api/htmlsingle/#overview
# https://docs.spring.io/spring-boot/docs/current/reference/html/actuator.html
management:
  endpoint:
    shutdown:
      enabled: true #除了shutdown，其它的endpoint默认都是开启的
    health:
      show-details: always #获得健康检查中所有指标的详细信息
    logfile:
      external-file: d:/log${server.servlet.context-path}/trade-root.log #高优先级.
  endpoints:
    web:
      exposure: #默认值访问health端点，用*可以包含全部端点(*号有特殊含义，因此需要加双引号)
        include: shutdown,health,info,loggers,logfile
    jmx:
      exposure:
        include:

logging:
  config: classpath:logback-test-spring.xml
  file:
    path: d:/log${server.servlet.context-path} #使用了logback之后，file.path或者file.name就已经失效了. path是怎么拼接成文件路径的，参考LogFile.toString
  level:
    org.apache.tomcat: INFO
    org.apache.catalina: INFO

#余额文件的路径
balanceFilePath: ${logging.file.path}/balance.txt

#properties.location: classpath:application-prd.yml

chat.maxHistory:  3

trade:
  core.package: com.liujun.trade_ff.core
  goods: eth #交易哪种商品。大小写随意，由各平台对应的trade类负责转换
  money: usd #用哪种货币完成交易。大小写随意，由各平台对应的trade类负责转换
  formatGoodsStr: "0.0000"
  formatMoneyStr: "0.00"
  earnMoney: true #赚取什么？钱还是货?如果赚钱，那么系统会保证货物数量保持不变
  minTradeValue: 11 #买卖币时，最小交易金额【美元】.币安规定不得小于10
  moneyPrice: 1 #计价货币值多少美元
  marketOrderSize: 100 #获取市场深度时，买单、卖单分别获取多少个？【对okcoin有效,chbtc固定是50】
  #交易一次(不包含"调节商品数量"等特殊交易)，最少要赚多少【美元】？如果扣除了各种成本，那么一毛钱也值得赚。亏损频率越高，atLeastEarn就应该越高。
  # 请不要考虑矿工费，因为maxEarnCost.earn已经减去了矿工费。这里应该拍脑袋决定
  atLeastEarn: 0.0145 #美元
  #最低利润率(差价除以价格)，跟滑点有关：因为uniswap上面建议的滑点是0.05%,比原链超导兑换建议1%
  atLeastRate: 0.002 #0.0001
  positionRate: 1 #仓位上限，占余额的比例。0.5表示50%，那么下跌2/3时爆仓。1表示100%，那么下跌50%时爆仓
  #dex和cex同步挂单吗？如果dex失败率高，就不要同步挂单。而是先让dex执行，执行成功后会发现资金失衡，然后通过调平资金的方式去执行cex
  #考虑两种策略：
  #    1.冒进型，跟别人激烈争抢，尽量设大滑点，然后两个平台同时提交(这个亏起来很厉害的)。
  #    2.保守型，设置很小的滑点，让dex先成交，如果成交失败，cex就不用执行了，也就没什么损失。这个不容易亏，但是也不容易抓住机会。
  dexSync: false
  whenBalance: 0.2 #百分数的小数形式。任意平台的coin数量比平均值偏移了多少，就触发转账
  canBalance: true #多个平台之间，能互相转账吗？双方的money和goods用的是同一条链的同一种货币？ cusd和usdc不在同一个链上，因此无法调拨.即使双方都是usdc,只要币安平台不支持该链的转账，也不行。
  needCheckTotalAmount: true #是否维持资金总量不变？如果账户被其它程序自动操控，资金量会不断变化。这时如果不想调节。

engine:
  time_queryOrder: 3 #间隔多少【秒】查询一次市场挂单. 请用3、6、9、12等等
  time_oneCycle: 30 #每循环一次，最大允许占用多少【秒】.dex执行一次可能要30秒，那么这期间这个系统都被阻塞
  time_sleep: 1000 #每次对平台进行写操作后，休眠多少【毫秒】
  waitSecondAfterException: 3 #如果抛出异常，暂停多少【秒】
  trade_model: simple #采取哪种模式匹配订单？simple, exact
  time_beginBalance: 0 #每天几点开始记录余额【单位：小时】
  time_waitBalance: 6 #间隔多久,记录余额？ 【单位：小时】

