  money: usdc #用哪种货币完成交易。大小写随意，由各平台对应的trade类负责转换
  moneyAddress: "0xB0d1435590B4f14A5f4414f93489945546162ffc"
  url: http://127.0.0.1:8093
  ethAddress: "0xB0d1435590B4f14A5f4414f93489945546162ffc"
  feeRate: 0.0005 #uniswap平台的交易手续费是多少？不同币种，手续费不一样，wbtc是0.3%或0.05%，稳定币兑换是0.01%. celo-cusd是0.3%
