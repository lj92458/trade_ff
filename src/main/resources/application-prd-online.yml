#-------------uniswap-------------------------------gas limit: 162773，实际使用：122694，总共0.009325eth
#矿工费4美元。要求利润大于这个数，才能交易。
#dex执行一次可能要30秒，那么这期间这个系统都被阻塞
uniswap:
  netWork: arbitrum #网络名称叫什么？ 各平台的网络名称必须相同， 而且是各平台的网络名称中共同的子字符串
  naitveToken: eth #链的原生币，大小写都行。也是gas消耗的币的名称。因为uniswap能用在多个区块链
  goods: weth #交易哪种商品。大小写随意，由各平台对应的trade类负责转换
  goodsAddress: "0x7c487F80BEe3D7aF9047Ee0E790f2B2A8BDBF1eC" #平台给出的充值地址 # "0xe068a01e11aCfA03A4c8de63dAd451E77a22CFfF" # "0xB0d1435590B4f14A5f4414f93489945546162ffc"
  money: usdt #用哪种货币完成交易。大小写随意，由各平台对应的trade类负责转换
  moneyAddress: "0x7c487F80BEe3D7aF9047Ee0E790f2B2A8BDBF1eC" #平台给出的充值地址 # "0xe068a01e11aCfA03A4c8de63dAd451E77a22CFfF" # "0xB0d1435590B4f14A5f4414f93489945546162ffc"
  url: http://127.0.0.1:8093
  ethAddress: "0x7c487F80BEe3D7aF9047Ee0E790f2B2A8BDBF1eC" # "0xe068a01e11aCfA03A4c8de63dAd451E77a22CFfF" # "0xB0d1435590B4f14A5f4414f93489945546162ffc"
  feeRate: 0.0005 #uniswap平台的交易手续费是多少？不同币种，手续费不一样，wbtc是0.3%或0.05%，稳定币兑换是0.01%. celo-cusd是0.3%
  gasPercent: 1 #强制调高gas价格，对矿工费进行悲观的估算.
  gasLimit: 4000000
  slipPage: 0.002 #滑点，0.001表示0.1%；或者 0.0005表示0.05% 设置大一点会导致亏损，但是这个参数就是提供了自愿亏损的机会:建议比atLeastRate稍微大一点

